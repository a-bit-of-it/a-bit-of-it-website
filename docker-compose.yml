services:
  frontend:
    image: ${frontend}
    restart: unless-stopped
    networks:
      - proxy-net
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"

  api:
    image: ${api}
    restart: unless-stopped
    networks:
      - proxy-net
    labels:
      caddy: ${DOMAIN}
      caddy.handle_path: /api/*
      caddy.handle_path.reverse_proxy: "{{upstreams 8080}}"

networks:
  proxy-net:
    external: true
